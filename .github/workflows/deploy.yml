# ============================================
# BluePrint ERP - Production Deployment
# ============================================
# Triggered by:
#   - Release published (creates version-tagged Docker image)
#   - Manual dispatch (for hotfixes / emergency deployments)
#
# Required Secrets:
#   - DEPLOY_HOST: Production server hostname/IP
#   - DEPLOY_USER: SSH username for deployment
#   - DEPLOY_SSH_KEY: Private SSH key for server access
#   - DEPLOY_PORT: SSH port (default: 22)
#   - DATABASE_PASSWORD: PostgreSQL password
#   - JWT_SECRET: JWT signing key (min 32 chars)
#   - REDIS_PASSWORD: Redis password
#   - NEXT_PUBLIC_APP_URL: Public URL of the application
#   - SMTP_HOST, SMTP_USER, SMTP_PASS: Email configuration
#   - STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET: Stripe configuration

name: Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      version:
        description: 'Version tag to deploy (leave empty for latest)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Build & Push Docker Image
  # ============================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Output image info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.APP_URL || 'https://blueprint.example.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: deploy-vars
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          IMAGE_DIGEST="${{ needs.build-and-push.outputs.image_digest }}"

          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -euo pipefail

            echo "============================================"
            echo "BluePrint ERP - Production Deployment"
            echo "============================================"
            echo "Image: ${{ steps.deploy-vars.outputs.full_image }}"
            echo "Digest: ${{ needs.build-and-push.outputs.image_digest }}"
            echo "Environment: ${{ steps.deploy-vars.outputs.environment }}"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================"

            # Navigate to application directory
            cd /opt/blueprint || { echo "ERROR: /opt/blueprint not found"; exit 1; }

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the latest image
            echo "Pulling Docker image..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app

            # Run database migrations (if using PostgreSQL)
            echo "Running database migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm app \
              npx prisma migrate deploy

            # Restart services with zero-downtime
            echo "Restarting application..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for health check..."
            timeout=60
            elapsed=0
            while [ $elapsed -lt $timeout ]; do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              echo "Waiting... ($elapsed/$timeout seconds)"
              sleep 5
              elapsed=$((elapsed + 5))
            done

            if [ $elapsed -ge $timeout ]; then
              echo "ERROR: Health check timed out after ${timeout}s"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 app
              exit 1
            fi

            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -f --filter "until=72h" --filter "label=org.opencontainers.image.source=${{ github.repository }}"

            echo "============================================"
            echo "Deployment completed successfully!"
            echo "============================================"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          # Allow some time for DNS propagation and startup
          sleep 10

          # Health check against public URL
          APP_URL="${{ vars.APP_URL || 'https://blueprint.example.com' }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/health" || echo "000")

          if [[ "${HTTP_STATUS}" == "200" ]]; then
            echo "✅ Deployment verified! Health check returned 200."
          else
            echo "⚠️ Health check returned ${HTTP_STATUS}. Manual verification may be needed."
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================
  # Post-Deployment Notification
  # ============================================
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - name: Send deployment notification
        run: |
          STATUS="${{ needs.deploy.result }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          ENV="${{ github.event.inputs.environment || 'production' }}"

          if [[ "${STATUS}" == "success" ]]; then
            EMOJI="✅"
            COLOR="good"
            MESSAGE="Deployment of ${IMAGE_TAG} to ${ENV} succeeded"
          elif [[ "${STATUS}" == "failure" ]]; then
            EMOJI="❌"
            COLOR="danger"
            MESSAGE="Deployment of ${IMAGE_TAG} to ${ENV} failed"
          else
            EMOJI="⚠️"
            COLOR="warning"
            MESSAGE="Deployment of ${IMAGE_TAG} to ${ENV} status: ${STATUS}"
          fi

          echo "${EMOJI} ${MESSAGE}"

          # Slack notification (uncomment and configure webhook secret to enable)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"${EMOJI} ${MESSAGE}\nRepository: ${{ github.repository }}\nActor: ${{ github.actor }}\nCommit: ${{ github.sha }}\",\"color\":\"${COLOR}\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

          # Discord notification (uncomment and configure webhook secret to enable)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"content\":\"${EMOJI} ${MESSAGE}\nRepository: ${{ github.repository }}\nActor: ${{ github.actor }}\nCommit: ${{ github.sha }}\"}" \
          #   ${{ secrets.DISCORD_WEBHOOK_URL }}
